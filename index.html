<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ระบบการจัดการแผนปีงบประมาณ</title>

  <meta name="description" content="ระบบการจัดการแผนปีงบประมาณ">
  <meta property="og:title" content="ระบบการจัดการแผนปีงบประมาณ">
  <meta property="og:description" content="ระบบบริหารจัดการแผนงาน โครงการ และงบประมาณ">
  <meta property="og:image" content="https://img2.pic.in.th/pic/-._0a07384e55bcb2336.png">

  <!-- นำเข้าฟอนต์ภาษาไทย Prompt จาก Google Fonts ให้ดูทันสมัย -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif; /* ใช้ฟอนต์ Prompt */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* พื้นหลังไล่สีแบบมีมิติและเคลื่อนไหวช้าๆ */
      background: linear-gradient(-45deg, #eaf2ff, #c3cfe2, #eaf2ff, #a1c4fd);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      padding: 50px 40px;
      /* ดีไซน์กล่องแบบ Glassmorphism (กระจกขุ่น) */
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 90%;
      /* เอฟเฟกต์ค่อยๆ ลอยขึ้นมาตอนโหลดหน้าเว็บ */
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
      transition: transform 0.3s ease;
    }

    /* ลูกเล่นเมื่อเอาเมาส์ชี้โลโก้ */
    .logo:hover {
      transform: scale(1.05);
    }

    h1 {
      color: #1e3a8a;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    p {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 40px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    /* ลูกเล่นเมื่อเอาเมาส์ชี้ปุ่ม */
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
    }

    /* ลูกเล่นเมื่อคลิกปุ่ม */
    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>

<body>

  <div class="container">

    <img 
      src="https://img2.pic.in.th/pic/-._0a07384e55bcb2336.png" 
      alt="โลโก้ระบบ" 
      class="logo"
    >

    <h1>ระบบการจัดการ<br>แผนปีงบประมาณ</h1>

    <p>
      ระบบบริหารจัดการแผนงาน<br>โครงการ และงบประมาณ
    </p>

    <!-- ลิงก์ไปยัง Google Apps Script -->
    <a 
      class="btn" 
      href="https://script.google.com/macros/s/AKfycbwaAomCFWZcCerKXTc44QXaYphzGLT2kxLHYQhP6jethW4oYmf1ypdX948nXZ2xrdA8OA/exec">
      เข้าสู่ระบบ
    </a>

  </div>

</body>
</html>
